version: '3.8'

services:
  # WebODM - Processamento de ortomosaicos
    # Acesso: http://localhost:8020
  # Para iniciar apenas o WebODM: docker compose up webodm -d
  webapp:
    image: opendronemap/webodm_webapp:latest
    container_name: ortomapas-webodm
    ports:
      - "8020:8000"
    volumes:
      - webodm_data:/webodm/app/media
    entrypoint: /bin/bash -c "service cron start; until PGPASSWORD=\"$${WO_DATABASE_PASSWORD}\" psql -h \"$${WO_DATABASE_HOST}\" -U \"$${WO_DATABASE_USER}\" -d \"$${WO_DATABASE_NAME}\" -c '\\q'; do echo 'Postgres is unavailable - sleeping'; sleep 2; done; /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/start.sh"
    depends_on:
      - broker
      - worker
    networks:
      - default
      - geoagentica_default
    environment:
      - WO_HOST=0.0.0.0
      - WO_PORT=8000
      - WO_DEBUG=NO
      - WO_BROKER=redis://broker:6379
      - WO_DATABASE_ENGINE=django.contrib.gis.db.backends.postgis
      - WO_DATABASE_NAME=webodm
      - WO_DATABASE_USER=geo
      - WO_DATABASE_PASSWORD=${GEOAGENTICA_DB_PASSWORD}
      - WO_DATABASE_HOST=geoagentica-banco
      - WO_DATABASE_PORT=5432
    restart: unless-stopped

  broker:
    image: redis:7-alpine
    container_name: ortomapas-redis
    restart: unless-stopped

  worker:
    image: opendronemap/webodm_webapp:latest
    container_name: ortomapas-webodm-worker
    depends_on:
      - broker
    volumes:
      - webodm_data:/webodm/app/media
    entrypoint: /bin/bash -c "until PGPASSWORD=\"$${WO_DATABASE_PASSWORD}\" psql -h \"$${WO_DATABASE_HOST}\" -U \"$${WO_DATABASE_USER}\" -d \"$${WO_DATABASE_NAME}\" -c '\\q'; do echo 'Postgres is unavailable - sleeping'; sleep 2; done; /webodm/wait-for-it.sh -t 0 broker:6379 -- /webodm/wait-for-it.sh -t 0 webapp:8000 -- /webodm/worker.sh start"
    networks:
      - default
      - geoagentica_default
    environment:
      - WO_DATABASE_ENGINE=django.contrib.gis.db.backends.postgis
      - WO_DATABASE_NAME=webodm
      - WO_DATABASE_USER=geo
      - WO_DATABASE_PASSWORD=${GEOAGENTICA_DB_PASSWORD}
      - WO_DATABASE_HOST=geoagentica-banco
      - WO_DATABASE_PORT=5432
      - WO_BROKER=redis://broker:6379
    restart: unless-stopped

  nodeodm:
    image: opendronemap/nodeodm:latest
    container_name: ortomapas-nodeodm
    ports:
      - "8021:3000"
    restart: unless-stopped

  # GeoServer - Publicacao de ortomapas como WMS/WMTS
  # Acesso: http://localhost:8080/geoserver
  # Login padrao: admin / geoserver
  geoserver:
    image: kartoza/geoserver:2.25.2
    container_name: ortomapas-geoserver
    ports:
      - "8080:8080"
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./data:/opt/geoserver/data_dir/coverages
    environment:
      - GEOSERVER_ADMIN_PASSWORD=geoserver
      - GEOSERVER_ADMIN_USER=admin
      - STABLE_EXTENSIONS=wps-plugin,css-plugin
      - COMMUNITY_EXTENSIONS=
    restart: unless-stopped

volumes:
  webodm_data:
  geoserver_data:

networks:
  geoagentica_default:
    external: true
